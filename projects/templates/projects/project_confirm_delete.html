{% extends "projects/base.html" %}

{% block title %}Delete Project | Student Project Management System{% endblock %}

{% block content %}
    <h1>Confirm project deletion</h1>
    <p>Are you sure you want to delete “{{ project.title }}”?</p>
    <form method="post">
        {% csrf_token %}
        <button class="button-danger" type="submit">Delete project</button>
        <a href="{% url 'project_list' %}">Cancel</a>
    </form>
{% endblock %}
